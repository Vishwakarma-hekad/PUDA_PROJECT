<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Drawing Scrutiny Report</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Your CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/pdf_report.css') }}">

</head>

<body>

<div class="container-fluid p-4">

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title">

                Drawing Scrutiny Report

            </h2>

            <small class="text-muted">

                Reference ID :
                <b>{{ ref_id }}</b>

            </small>

        </div>

        <div>

            <button class="btn btn-primary"
                    onclick="reloadReport()">

                <i class="bi bi-arrow-clockwise"></i>

                Reload

            </button>

            <button class="btn btn-success"
                    onclick="downloadExcel()">

                <i class="bi bi-file-earmark-excel"></i>

                Excel

            </button>

            <button class="btn btn-danger"
                    onclick="downloadPDF()">

                <i class="bi bi-file-earmark-pdf"></i>

                PDF

            </button>

            <button class="btn btn-secondary"
                    onclick="printReport()">

                <i class="bi bi-printer"></i>

                Print

            </button>

        </div>

    </div>


    <!-- ============================= -->
    <!-- SEARCH -->
    <!-- ============================= -->

    <div class="row mb-3">

        <div class="col-md-6">

            <input
                    type="text"
                    id="searchText"
                    class="form-control"
                    placeholder="Search report section...">

        </div>

        <div class="col-md-6 text-end">

            <button class="btn btn-outline-primary"

                    onclick="expandAllSections()">

                Expand All

            </button>

            <button class="btn btn-outline-secondary"

                    onclick="collapseAllSections()">

                Collapse All

            </button>

            <button class="btn btn-outline-success"

                    onclick="copyJson()">

                Copy JSON

            </button>

            <button class="btn btn-outline-dark"

                    onclick="downloadJson()">

                Download JSON

            </button>

        </div>

    </div>


    <!-- ============================= -->
    <!-- LOADER -->
    <!-- ============================= -->

    <div id="loading">

        <div class="loader"></div>

        <div class="mt-3">

            Loading Report...

        </div>

    </div>


    <!-- ============================= -->
<!-- REPORT -->
<!-- ============================= -->

<div id="reportContent">

    <!-- REQUEST SUMMARY -->

    <div class="card shadow mb-4">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">REQUEST SUMMARY</h5>

        </div>

        <div class="card-body">

            <div id="requestSummaryTable"></div>

        </div>

    </div>

    <div class="card shadow mb-4">

        <div class="card-header bg-success text-white">

        <h5 class="mb-0">
            PROJECT SUMMARY
        </h5>
        <div class="card-body">

        <div id="projectSummaryTable"></div>

        </div>
    </div>

    <div class="card shadow mb-4">

        <div class="card-header bg-warning">

            <h5 class="mb-0">PROPOSED WORK DIMENSIONS</h5>

        </div>

        <div class="card-body">

            <div id="proposedWorkTable"></div>

        </div>

    </div>

    <div class="card shadow mb-4">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">PARKING SUMMARY</h5>

        </div>

        <div class="card-body">

            <div id="parkingSummaryTable"></div>

        </div>

    </div>


    <div class="card shadow mb-4">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">ROOM INFORMATION</h5>

        </div>

        <div class="card-body">

            <div id="roomInformationTable"></div>

        </div>

    </div>

    <div class="card shadow mb-4">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">NET BUILT UP AREA DETAILS</h5>
        </div>

        <div class="card-body">

            <div id="netBuiltupAreaTable"></div>

        </div>

    </div>

    <div class="card shadow mb-4">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">ROOM VENTILATION INFO</h5>
        </div>

        <div class="card-body">

            <div id="roomventiInfo"></div>

        </div>

    </div>
    <div class="card shadow mb-4">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">LIFT TO STAIRCASE INFORMATION </h5>
        </div>

        <div class="card-body">

            <div id="LifttoStairInfo"></div>

        </div>

    </div>

    <div class="card shadow mb-4">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">BUILDING TO BUILDING INFORMATION </h5>
        </div>

        <div class="card-body">

            <div id="BuildingtoBuildingInfo"></div>

        </div>

    </div>

</div>


<!-- Hidden Reference -->

<input

        type="hidden"

        id="refId"

        value="{{ ref_id }}">


<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- Excel -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<!-- PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


<!-- Report JS -->

<script src="{{ url_for('static', path='js/pdf_report.js') }}"></script>

</body>

</html>
