<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}BP Connect{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <!-- Page Specific CSS -->
    {% block css %}{% endblock %}
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <nav class="sidebar">

        <div class="logo">
            <img src="/static/images/logo.png">
            <h4>BP Connect</h4>
        </div>

        <ul>

            <li><a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>

            <li><a href="/upload"><i class="bi bi-upload"></i> Upload Drawing</a></li>

            <li><a href="/applications"><i class="bi bi-folder"></i> Applications</a></li>

            <li><a href="/reports"><i class="bi bi-file-earmark-text"></i> Reports</a></li>

            <li><a href="/processing"><i class="bi bi-clock-history"></i> Processing Status</a></li>

            <li><a href="/profile"><i class="bi bi-person"></i> Profile</a></li>

            <li><a href="/settings"><i class="bi bi-gear"></i> Settings</a></li>

            <li><a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>

        </ul>

    </nav>

    <!-- Main -->
    <div class="main">

        <!-- Navbar -->
        <nav class="navbar bg-white shadow-sm px-4">

            <h3>{% block page_title %}{% endblock %}</h3>

            <div>

                <span class="me-3">
                    Welcome {{ username }}
                </span>

                <img src="https://i.pravatar.cc/40"
                     class="rounded-circle">

            </div>

        </nav>

        <!-- Page Content -->
        <div class="container-fluid mt-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Page Specific JS -->
{% block script %}{% endblock %}

</body>

</html>
