{% extends "base_authentication.html" %}


{% block title %}
Reset Password | BP Connect
{% endblock %}


{% block content %}

<div class="card auth-card">

    <div class="auth-body">


        <!-- Logo -->

        <div class="text-center mb-4">

            <img
                src="{{ url_for('static', path='images/logo.png') }}"
                class="auth-logo"
                alt="BP Connect"
            >

            <h3 class="auth-title mt-3">
                Reset Password
            </h3>

            <p class="auth-subtitle">
                Enter your new password below.
            </p>

        </div>


        <!-- JavaScript Message -->

        <div id="message"></div>


        <!-- Reset Password Form -->

        <form id="resetPasswordForm">


            <!-- New Password -->

            <div class="mb-3">

                <label
                    class="form-label"
                    for="password"
                >
                    New Password
                </label>


                <div class="input-group">

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        name="password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="btn btn-outline-secondary password-toggle"
                        id="togglePassword"
                    >

                        <i
                            class="bi bi-eye"
                            id="passwordIcon"
                        ></i>

                    </button>

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="mb-3">

                <label
                    class="form-label"
                    for="confirmPassword"
                >
                    Confirm Password
                </label>


                <div class="input-group">

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="btn btn-outline-secondary password-toggle"
                        id="toggleConfirmPassword"
                    >

                        <i
                            class="bi bi-eye"
                            id="confirmPasswordIcon"
                        ></i>

                    </button>

                </div>


                <!-- Password Error -->

                <div
                    id="passwordError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- Reset Button -->

            <div class="d-grid mt-4">

                <button
                    type="submit"
                    class="btn btn-primary btn-auth"
                    id="resetButton"
                >

                    <span id="buttonText">
                        Reset Password
                    </span>

                    <span
                        id="buttonSpinner"
                        class="spinner-border spinner-border-sm d-none ms-2"
                        role="status"
                        aria-hidden="true"
                    ></span>

                </button>

            </div>


            <!-- Back to Login -->

            <div class="auth-footer">

                Remember your password?

                <a
                    href="/login"
                    class="auth-link"
                >
                    Login
                </a>

            </div>


        </form>

    </div>

</div>

{% endblock %}


{% block javascript %}

<script
    src="{{ url_for('static', path='js/reset_password.js') }}"
></script>

{% endblock %}
