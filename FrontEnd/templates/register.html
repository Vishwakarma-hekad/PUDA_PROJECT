<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-5 col-md-7">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-body p-5">

<div class="text-center mb-4">

<img src="/static/images/logo.png" width="90">

<h3 class="fw-bold mt-3">BP Connect</h3>

<p class="text-muted">Create Your Account</p>

</div>

<form action="/register" method="post" onsubmit="return validateForm()">

<div class="mb-3">

<label class="form-label"> Full Name </label>

<input type="text" class="form-control" name="fullname" required>

</div>

<div class="mb-3">

<label class="form-label">Username</label>

<input type="text" class="form-control" name="username" required>

</div>

<div class="mb-3">

<label class="form-label">Email</label>

<input type="email" class="form-control" name="email" required>

</div>

<div class="mb-3">

<label class="form-label">Mobile Number</label>

<input type="tel" class="form-control" name="phone" maxlength="10" required>

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<div class="input-group">

<input type="password" class="form-control" id="password"name="password" required>

<button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password')">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="mb-3">

<label class="form-label">Confirm Password</label>

<div class="input-group">

<input type="password" class="form-control" id="confirmPassword" required>

<button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword')">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="d-grid mt-4">

<button class="btn btn-primary btn-lg">Register</button>

</div>

<div class="text-center mt-4">Already have an account?

<a href="/login">Login</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="/static/js/register.js"></script>

</body>

</html>
