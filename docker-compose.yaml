services:

  web:
    build: .
    container_name: puda_app
    ports:
      - "8000:8000"
    env_file:
      - .env

    depends_on:
      - redis
      - db
    restart: unless-stopped

  worker:
    build: .
    container_name: puda_worker
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: puda_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: puda_db
    environment:
      POSTGRES_DB: PUDA_DATABASE
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ads2023!

volumes:
  postgres_data: