services:

  web:
    build: .
    container_name: puda_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - db
    restart: unless-stopped
    volumes:
      - ./Storage:/PUDA_APP/Storage

  worker:
    build: .
    container_name: puda_worker
    command: celery -A Backend.celery_worker:celery worker --pool=solo --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db
    restart: unless-stopped
    volumes:
      - ./Storage:/PUDA_APP/Storage

  redis:
    image: redis:7
    container_name: puda_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: puda_db
    environment:
      POSTGRES_DB: PUDA_DATABASE
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ads2023!
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data: